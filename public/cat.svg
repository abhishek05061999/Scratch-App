<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="95" height="100" viewBox="0 0 95 100">
  <defs>
    <linearGradient id="catBodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d62" />
      <stop offset="100%" stop-color="#ff7f38" />
    </linearGradient>
    <radialGradient id="catEyeGradient" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e0f7ff" />
      <stop offset="100%" stop-color="#59c1ff" />
    </radialGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="47.5" cy="58" rx="35" ry="38" fill="url(#catBodyGradient)" />
  
  <!-- Head -->
  <circle cx="47.5" cy="40" r="25" fill="url(#catBodyGradient)" />
  
  <!-- Ears -->
  <polygon points="30,23 23,5 37,15" fill="#ff7f38" />
  <polygon points="65,23 72,5 58,15" fill="#ff7f38" />
  <polygon points="32,24 27,10 38,17" fill="#ffcbad" />
  <polygon points="63,24 68,10 57,17" fill="#ffcbad" />
  
  <!-- Face -->
  <circle cx="38" cy="35" r="6" fill="white" />
  <circle cx="57" cy="35" r="6" fill="white" />
  <circle cx="38" cy="35" r="4" fill="url(#catEyeGradient)" />
  <circle cx="57" cy="35" r="4" fill="url(#catEyeGradient)" />
  <circle cx="36.5" cy="33.5" r="1.5" fill="black" />
  <circle cx="55.5" cy="33.5" r="1.5" fill="black" />
  <ellipse cx="47.5" cy="42" rx="3.5" ry="2.5" fill="#ff4081" />
  
  <!-- Whiskers -->
  <line x1="30" y1="42" x2="15" y2="37" stroke="white" stroke-width="1.5" />
  <line x1="30" y1="45" x2="15" y2="45" stroke="white" stroke-width="1.5" />
  <line x1="30" y1="48" x2="15" y2="53" stroke="white" stroke-width="1.5" />
  
  <line x1="65" y1="42" x2="80" y2="37" stroke="white" stroke-width="1.5" />
  <line x1="65" y1="45" x2="80" y2="45" stroke="white" stroke-width="1.5" />
  <line x1="65" y1="48" x2="80" y2="53" stroke="white" stroke-width="1.5" />
  
  <!-- Nose -->
  <path d="M47.5,40 L45,44 L50,44 Z" fill="black" />
  
  <!-- Mouth -->
  <path d="M47.5,44 Q47.5,49 52,48" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" />
  <path d="M47.5,44 Q47.5,49 43,48" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Paws -->
  <ellipse cx="32" cy="90" rx="10" ry="6" fill="#ffcbad" transform="rotate(-10, 32, 90)" />
  <ellipse cx="63" cy="90" rx="10" ry="6" fill="#ffcbad" transform="rotate(10, 63, 90)" />
</svg> 